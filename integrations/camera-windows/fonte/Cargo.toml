[workspace]

[package]
name = "quall-camera-fonte"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MPL-2.0"
publish = false
description = "Biblioteca interna de constantes e contratos herdados da fonte de câmera Windows do Quall."

[lib]
name = "quall_camera_fonte"
# Apenas rlib: o Quall Monitor não produz ou instala um servidor COM de câmera.
crate-type = ["rlib"]
path = "src/lib.rs"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
# Nota: `implement` **não** é feature do crate `windows` 0.62 — o `#[implement]` vem do
# `windows-implement`, que o `windows-core` já arrasta sem feature nenhuma. Pedi-la aqui só
# produz "does not have that feature" com uma lista de mil linhas.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
