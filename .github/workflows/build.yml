name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  QUALL_MONITOR_VERSAO: 0.1.1
  QUALL_MONITOR_BUILD: 2

jobs:
  core:
    name: Core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: cargo test -p quall-core --no-default-features --locked
      - run: python3 tools/verify-distribution.py

  macos:
    name: Mac ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Native tools
        run: command -v cmake >/dev/null || brew install cmake
      - name: Package app
        run: apps/macos/Empacotar/empacotar.sh
      - name: Mac library tests
        run: xcrun swift test --package-path apps/macos --jobs 2
      - name: Verify source notices
        run: python3 tools/verify-distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: Quall-Monitor-macos-${{ matrix.arch }}-validation
          path: |
            dist/macos/*.zip
            dist/macos/*.dmg
            dist/macos/*.sha256
          if-no-files-found: error

  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: ilammy/setup-nasm@v1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows
          cache-on-failure: true
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.Util.wixext/5.0.2
          wix extension add -g WixToolset.Firewall.wixext/5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
      - name: Windows library tests
        run: cargo test --release --manifest-path apps/windows/Cargo.toml --lib --locked
      - name: Build app and MSI
        shell: pwsh
        run: |
          ./apps/windows/scripts/instalador/construir-msi.ps1 -Versao 0.1.1 -Idioma pt-BR -Destino "$pwd/dist/windows"
          ./apps/windows/scripts/instalador/construir-msi.ps1 -Versao 0.1.1 -Idioma en-US -SoEmpacotar -Destino "$pwd/dist/windows"
      - name: Verify source notices
        run: python tools/verify-distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: Quall-Monitor-windows-x64-validation
          path: |
            dist/windows/*.msi
            dist/windows/*.sha256
            dist/windows/*.validation.json
          if-no-files-found: error
